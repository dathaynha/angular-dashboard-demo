<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Datha Ops — Angular dashboard demo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A responsive Angular operations dashboard with KPI cards, charts, a request-flow Sankey and a data table. Mock data."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Theme before first paint: the saved choice, else the system preference.
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
